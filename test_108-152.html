function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function qKey(sec, item) {
  if (sec === 'single') return 's:' + (item.label || item.q.slice(0, 40));
  if (sec === 'fill') return 'f:' + (item.n || item.q.slice(0, 40));
  if (sec === 'match') return 'm:' + item.left.join('|').slice(0, 60);
  return sec + ':' + JSON.stringify(item).slice(0, 40);
}

function loadFreq() {
  try { return JSON.parse(localStorage.getItem(FREQ_KEY) || '{}'); } catch(e) { return {}; }
}
function saveFreq(f) {
  try { localStorage.setItem(FREQ_KEY, JSON.stringify(f)); } catch(e) {}
}
function recordError(sec, item) {
  const key = qKey(sec, item);
  const f = loadFreq();
  if (!f[key]) f[key] = { count: 0, sec, q: item.q || (item.left && item.left.join('; ')) || '', n: item.label || item.n || '' };
  f[key].count++;
  f[key].last = Date.now();
  // store brief answer hint for display
  if (sec === 'single') f[key].hint = (item.opts && item.correct) ? item.opts[item.correct - 1] : '';
  else if (sec === 'fill') f[key].hint = (item.show || item.ans || '').replace(/\|/g, ' / ');
  else if (sec === 'match') f[key].hint = 'таблица соответствия';
  saveFreq(f);
}

function buildFullV() {
  return {
    single: shuffle(D.single).map(q => {
      const ord = shuffle(q.opts.map((_, k) => k));
      return {
        label: q.label, q: q.q,
        opts: ord.map(k => q.opts[k]),
        correct: ord.indexOf(q.correct - 1) + 1,
        alts: (q.alts || []).map(a => ord.indexOf(a - 1) + 1),
        _orig: q
      };
    }),
    fill: shuffle(D.fill).map(f => Object.assign({}, f, { _orig: f })),
    match: shuffle(D.match).map(t => {
      const ord = shuffle(t.right.map((_, k) => k));
      const map = {};
      ord.forEach((old, p) => { map[t.right[old].L] = LET[p]; });
      return {
        left: t.left,
        right: ord.map((old, p) => ({ L: LET[p], t: t.right[old].t, _origL: t.right[old].L })),
        ans: t.ans.map(a => a.split('').map(l => map[l]).sort().join('')),
        _orig: t
      };
    })
  };
}

function buildRetryV(sec, wrongIndices, fullV) {
  // wrongIndices are indices in the current V[sec] that were wrong
  const items = wrongIndices.map(i => fullV[sec][i]);
  if (sec === 'single') {
    return items.map(q => {
      // re-shuffle options for retry
      const base = q._orig || q;
      const ord = shuffle(base.opts.map((_, k) => k));
      return {
        label: base.label, q: base.q,
        opts: ord.map(k => base.opts[k]),
        correct: ord.indexOf(base.correct - 1) + 1,
        alts: (base.alts || []).map(a => ord.indexOf(a - 1) + 1),
        _orig: base
      };
    });
  }
  if (sec === 'fill') return items.map(f => Object.assign({}, f._orig || f, { _orig: f._orig || f }));
  if (sec === 'match') {
    return items.map(t => {
      const base = t._orig || t;
      const ord = shuffle(base.right.map((_, k) => k));
      const map = {};
      ord.forEach((old, p) => { map[base.right[old].L] = LET[p]; });
      return {
        left: base.left,
        right: ord.map((old, p) => ({ L: LET[p], t: base.right[old].t })),
        ans: base.ans.map(a => a.split('').map(l => map[l]).sort().join('')),
        _orig: base
      };
    });
  }
  return items;
}

function loadProgress() {

      // ensure draft exists
      if (!S.match.draft) S.match.draft = {};

function hasProgress() {

  V = buildFullV();

function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function norm(s) { return s.toLowerCase().replace(/ё/g, 'е').replace(/[^а-яa-z0-9]+/g, ' ').trim(); }
function ansShow(a) { return a.replace(/\|/g, ' или ').replace(/;/g, ', '); }
function checkFill(ans, input) {
  const v = norm(input);
  if (!v) return false;
  const words = ' ' + v + ' ';
  return ans.split(';').every(part => {
    const alts = part.split('|').map(norm).filter(Boolean);
    return alts.some(a => a.length <= 3 ? words.includes(' ' + a + ' ') : v.includes(a));
  });
}
function mk(tag, cls, html) {
  const el = document.createElement(tag);
  if (cls) el.className = cls;
  if (html != null) el.innerHTML = html;
  return el;
}

function N(sec) { return V[sec].length; }

function isSectionComplete(sec) {
  return Object.keys(S[sec].res).length >= N(sec) && N(sec) > 0;
}

function wrongIndices(sec) {
  const res = S[sec].res;
  const idxs = [];
  for (let i = 0; i < N(sec); i++) {
    if (!res[i]) continue;
    if (sec === 'match') {
      if (!res[i].rowOk.every(Boolean)) idxs.push(i);
    } else {
      if (!res[i].ok) idxs.push(i);
    }
  }
  return idxs;
}

function showScore() {
  const sr = Object.values(S.single.res), fr = Object.values(S.fill.res), mr = Object.values(S.match.res);
  let rowsOk = 0, rowsTot = 0;
  mr.forEach(r => { rowsTot += r.rowOk.length; rowsOk += r.rowOk.filter(Boolean).length; });
  const modeNote = (s) => mode[s] === 'retry' ? ' <span class="mode-badge">ошибки</span>' : '';
  document.getElementById('score').innerHTML =
    'Тест' + modeNote('single') + ': верно <b>' + sr.filter(x => x.ok).length + '</b> из ' + sr.length + ' (всего ' + V.single.length + ')<br>' +
    'Дополните' + modeNote('fill') + ': верно <b>' + fr.filter(x => x.ok).length + '</b> из ' + fr.length + ' (всего ' + V.fill.length + ')<br>' +
    'Соответствие' + modeNote('match') + ': верных строк <b>' + rowsOk + '</b> из ' + rowsTot;
}

function go(sec, i) {
  S[sec].i = Math.max(0, Math.min(N(sec) - 1, i));
  render();
}
function autoNext(sec, idx, ok) {
  if (!ok) return;
  setTimeout(() => {
    if (S.cur === sec && S[sec].i === idx) {
      if (idx < N(sec) - 1) go(sec, idx + 1);
      else render(); // show completion / retry offer
    }
  }, AUTO_DELAY);
}
function nextBtn(sec, i) {
  const b = mk('button', 'check', i >= N(sec) - 1 ? 'К итогам раздела' : 'Следующий вопрос →');
  b.onclick = () => {
    if (i >= N(sec) - 1) render();
    else go(sec, i + 1);
  };
  return b;
}
function navEl(sec) {
  const i = S[sec].i, n = N(sec);
  const bar = mk('div', 'navbar',
    '<button ' + (i === 0 ? 'disabled' : '') + '>← Назад</button>' +
    '<span>' + (i + 1) + ' из ' + n + (mode[sec] === 'retry' ? ' (только ошибки)' : '') + '</span>' +
    '<button ' + (i >= n - 1 ? 'disabled' : '') + '>Далее →</button>');
  const [prev, next] = bar.querySelectorAll('button');
  prev.onclick = () => go(sec, i - 1);
  next.onclick = () => go(sec, i + 1);
  return bar;
}

function offerRetry(sec) {
  const wrong = wrongIndices(sec);
  if (wrong.length === 0) {
    const box = mk('div', 'section-done');

  const box = mk('div', 'retry-box');
  const name = sec === 'single' ? 'теста' : (sec === 'fill' ? 'дополнений' : 'соответствий');
  box.innerHTML = '<p>Вы ответили на все задания ' + name + '.<br>Ошибок: <b>' + wrong.length + '</b>.<br>Хотите решить только те задания, в которых были ошибки?</p>';
  const yes = mk('button', 'yes', 'Да, повторить ошибки');
  const no = mk('button', 'no', 'Нет, оставить как есть');
  yes.onclick = () => {
    const newItems = buildRetryV(sec, wrong, V);
    V[sec] = newItems;
    mode[sec] = 'retry';
    S[sec] = { i: 0, res: {}, draft: sec === 'match' ? {} : undefined };
    if (sec === 'match') S.match.draft = {};
    saveProgress();
    render();

  };

    render();

  box.appendChild(no);
  return box;
}

    card.appendChild(mk('div', 'note ' + (r.ok ? 'ok' : 'bad'),
      r.ok ? 'Верно!' : 'Неверно. Правильный ответ: ' + [q.correct].concat(q.alts || []).map(n => n + ') ' + esc(q.opts[n - 1])).join(' или ')));
    if (!r.ok) card.appendChild(nextBtn('single', i));
  }
  box.appendChild(card);
}

function renderFill() {
  const box = document.getElementById('s-fill');
  box.innerHTML = '';
  if (N('fill') === 0) {
    box.appendChild(mk('div', 'card', '<p>Нет заданий.</p>'));
    return;
  }
  if (isSectionComplete('fill') && !S.fill._retryDeclined) {
    box.appendChild(offerRetry('fill'));
    return;
  }
  const i = S.fill.i, f = V.fill[i], r = S.fill.res[i];
  box.appendChild(navEl('fill'));
  const card = mk('div', 'card',
    '<div class="qnum">Задание ' + (i + 1) + (mode.fill === 'retry' ? ' <span class="mode-badge">повтор ошибки</span>' : '') + '</div>' +
    '<div class="qtext">' + esc(f.q) + '</div>');
  const inp = mk('input', 'fill');
  inp.placeholder = 'Впишите ответ';
  inp.value = r ? r.val : '';
  const btn = mk('button', 'check', 'Проверить');
  card.appendChild(inp);
  card.appendChild(btn);
  if (r) {
    inp.disabled = true; btn.disabled = true;
    inp.style.background = r.ok ? '#c6f6d5' : '#fed7d7';
    card.appendChild(mk('div', 'note ' + (r.ok ? 'ok' : 'bad'),
      r.ok ? 'Верно!' : 'Неверно. Правильный ответ: ' + esc(ansShow(f.ans))));
    if (!r.ok) card.appendChild(nextBtn('fill', i));
  }
  const check = () => {
    if (S.fill.res[i]) return;
    const ok = checkFill(f.ans, inp.value);
    S.fill.res[i] = { val: inp.value, ok };
    if (!ok) recordError('fill', f._orig || f);
    render();
    autoNext('fill', i, ok);
  };
  btn.onclick = check;
  inp.onkeydown = e => { if (e.key === 'Enter') check(); };
  box.appendChild(card);
  if (!r) inp.focus();
}

function renderMatch() {
  const box = document.getElementById('s-match');
  box.innerHTML = '';
  if (N('match') === 0) {
    box.appendChild(mk('div', 'card', '<p>Нет заданий.</p>'));
    return;
  }
  if (isSectionComplete('match') && !S.match._retryDeclined) {
    box.appendChild(offerRetry('match'));
    return;
  }
  const i = S.match.i, t = V.match[i], r = S.match.res[i];
  box.appendChild(navEl('match'));
  const card = mk('div', 'card',
    '<div class="qnum">Задание ' + (i + 1) + ' (соответствие)' + (mode.match === 'retry' ? ' <span class="mode-badge">повтор ошибки</span>' : '') + '</div>' +
    '<div class="hint">Отметьте галочками подходящие варианты для каждого пункта. Можно выбрать несколько.</div>');

  if (!S.match.draft[i]) S.match.draft[i] = t.left.map(() => []);
  const sel = r ? r.sel : S.match.draft[i];

  t.left.forEach((lt, li) => {
    const row = mk('div', 'match-row' + (r ? (r.rowOk[li] ? ' ok' : ' bad') : ''),
      '<div class="lab">' + (li + 1) + '. ' + esc(lt) + '</div>');
    const opts = mk('div', 'match-opts');
    t.right.forEach(x => {
      const isSel = sel[li].includes(x.L);
      const lab = mk('label', 'match-opt' + (isSel ? ' sel' : ''));
      if (r) {
        const should = t.ans[li].includes(x.L);
        if (should) lab.classList.add('correct-opt');
        else if (isSel) lab.classList.add('wrong-opt');
      }
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = isSel;
      cb.disabled = !!r;
      cb.onchange = () => {
        if (S.match.res[i]) return;
        const d = S.match.draft[i];
        if (cb.checked) {
          if (!d[li].includes(x.L)) d[li] = d[li].concat(x.L);
        } else {
          d[li] = d[li].filter(z => z !== x.L);
        }
        renderMatch();
      };
      lab.appendChild(cb);
      const span = document.createElement('span');
      span.innerHTML = '<b>' + x.L + '.</b> ' + esc(x.t);
      lab.appendChild(span);
      opts.appendChild(lab);
    });
    row.appendChild(opts);
    if (r && !r.rowOk[li]) {
      row.appendChild(mk('div', 'row-note', 'Правильно: ' + t.ans[li].split('').join(', ')));
    }
    card.appendChild(row);
  });

  const btn = mk('button', 'check', 'Проверить таблицу');
  if (r) btn.disabled = true;
  btn.onclick = () => {
    if (S.match.res[i]) return;
    const rowOk = t.left.map((_, li) =>
      S.match.draft[i][li].slice().sort().join('') === t.ans[li].split('').sort().join(''));
    S.match.res[i] = { sel: S.match.draft[i].map(a => a.slice()), rowOk };
    if (!rowOk.every(Boolean)) recordError('match', t._orig || t);
    render();
    autoNext('match', i, rowOk.every(Boolean));
  };
  card.appendChild(btn);
  if (r && !r.rowOk.every(Boolean)) card.appendChild(nextBtn('match', i));
  box.appendChild(card);
}

function renderFreq() {
  const box = document.getElementById('s-freq');
  box.innerHTML = '';
  const f = loadFreq();
  const entries = Object.entries(f)
    .filter(([, v]) => v.count >= FREQ_THRESHOLD)
    .sort((a, b) => b[1].count - a[1].count);
  const card = mk('div', 'card');
  card.appendChild(mk('div', 'qtext', 'Часто ошибаемые задания'));
  card.appendChild(mk('div', 'hint', 'Здесь собираются задания, в которых вы ошиблись ' + FREQ_THRESHOLD + ' и более раз (по всем проходам). Счётчик увеличивается каждый раз, когда вы даёте неверный ответ.'));
  if (entries.length === 0) {
    card.appendChild(mk('div', 'freq-empty', 'Пока нет повторяющихся ошибок. Пройдите тесты — задания, на которых вы будете ошибаться несколько раз, появятся здесь.'));
  } else {
    entries.forEach(([key, v]) => {
      const secName = v.sec === 'single' ? 'Тест' : (v.sec === 'fill' ? 'Дополните' : 'Соответствие');
      const el = mk('div', 'freq-item');
      el.innerHTML =
        '<div><span class="cnt">' + v.count + '× ошибка</span> · ' + secName +
        (v.n ? ' · №' + esc(String(v.n)) : '') + '</div>' +
        '<div style="margin-top:4px">' + esc(v.q || key) + '</div>' +
        (v.hint ? '<div style="margin-top:4px;color:#4a5568">Ответ: ' + esc(v.hint) + '</div>' : '');
      card.appendChild(el);
    });
  }
  const clearBtn = mk('button', 'check', 'Очистить список частых ошибок');
  clearBtn.style.background = '#c53030';
  clearBtn.onclick = () => {
    if (confirm('Очистить счётчики частых ошибок?')) {
      localStorage.removeItem(FREQ_KEY);
      renderFreq();
    }
  };
  card.appendChild(clearBtn);
  box.appendChild(card);
}

function render() {
  ['single', 'fill', 'match', 'freq'].forEach(s => {
    const el = document.getElementById('s-' + s);
    if (el) el.classList.toggle('hidden', s !== S.cur);
  });
  document.querySelectorAll('nav button[data-tab]').forEach(b => {
    b.classList.toggle('active', b.dataset.tab === S.cur);
  });
  if (S.cur === 'single') renderSingle();
  else if (S.cur === 'fill') renderFill();
  else if (S.cur === 'match') renderMatch();
  else if (S.cur === 'freq') renderFreq();
  saveProgress();
  showScore();
}

document.getElementById('resetBtn').onclick = resetAll;
document.querySelectorAll('nav button[data-tab]').forEach(b => {
  b.onclick = () => { S.cur = b.dataset.tab; render(); window.scrollTo(0, 0); };
});

render();
</script>
</body>
</html>
